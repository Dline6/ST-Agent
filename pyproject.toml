[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-agent"
version = "0.1.0"
description = "面向个性化投资决策的可配置主动服务 Agent（本地优先 · 中性视角）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
    "baostock>=0.9.4",  # T-L0-005.1 真实抓取器（联网依赖；缺失时走 unavailable 显式分支）
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
