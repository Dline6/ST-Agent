[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-agent"
version = "0.1.0"
description = "面向个性化投资决策的可配置主动服务 Agent（本地优先 · 中性视角）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# T-L0-005.1 真实抓取器：联网可选依赖，缺失时走 unavailable 显式分支（见 03 §1.2 / T-L0-005.1）。
# 安装：pip install -e ".[market]"
market = ["baostock>=0.9.4"]
# T-UI-002.2 桌面壳：pywebview（系统 WebView 三引擎）+ pystray（托盘）。CI 与服务端不装——
# 壳边模块惰性导入，缺依赖时显式抛 ShellSurfaceUnavailable（D-076 ①）。
# 安装：pip install -e ".[shell]"
shell = ["pywebview>=5.0", "pystray>=0.19"]
# T-UI-002.3 打包：PyInstaller 只在**构建机**上需要（CI 的 check job 不装）。
# 安装：pip install -e ".[packaging]"
packaging = ["pyinstaller>=6.0"]
# T-UI-002.4.2 口令记忆：keyring（Windows 凭据管理器 / macOS 钥匙串 / Linux Secret Service）。
# CI 与发布不装——不可用时**降级为每次索取并显式告知**（02 §3 / D-078 ②）。
# 安装：pip install -e ".[keyring]"
keyring = ["keyring>=24.0"]

[tool.setuptools.packages.find]
# src 布局：包根在 src/，否则 wheel 里会打成 src/st_agent/...（import st_agent 失败）
where = ["src"]
include = ["st_agent*"]
# dev 面（浏览器直开的走查面板等）在发布构建里**物理剔除**——D-060 ④I：开发/验收期的
# 可达性用「显式 dev 开关 + 发布包剔除」兜住。剔除后 `build_ui(dev=True)` 会显式失败。
exclude = ["st_agent.ui.dev"]

[tool.setuptools.package-data]
# 无构建前端资产随包走：原生 ES modules，产物即静态文件（D-063 ①）。
# （市场库 DDL `st_agent/l0/market/schema.sql` 不在本表里：setuptools 默认的
#  include-package-data 已带上它——T-UI-002.3 实测 `pip wheel` 产物核对过。）
"st_agent.ui" = [
    "web/*.html",
    "web/css/*.css",
    "web/js/*.js",
    "web/js/components/*.js",
    "web/js/plugins/l3/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "项目管理/tools"]
addopts = "-q -m 'not live'"
markers = [
    "live: 真实网络/长跑集成用例（默认排除；用 pytest -m live 单跑，不进 CI）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
