[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-agent"
version = "0.1.0"
description = "面向个性化投资决策的可配置主动服务 Agent（本地优先 · 中性视角）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# T-L0-005.1 真实抓取器：联网可选依赖，缺失时走 unavailable 显式分支（见 03 §1.2 / T-L0-005.1）。
# 安装：pip install -e ".[market]"
market = ["baostock>=0.9.4"]

[tool.setuptools.packages.find]
# src 布局：包根在 src/，否则 wheel 里会打成 src/st_agent/...（import st_agent 失败）
where = ["src"]
include = ["st_agent*"]
# dev 面（浏览器直开的走查面板等）在发布构建里**物理剔除**——D-060 ④I：开发/验收期的
# 可达性用「显式 dev 开关 + 发布包剔除」兜住。剔除后 `build_ui(dev=True)` 会显式失败。
exclude = ["st_agent.ui.dev"]

[tool.setuptools.package-data]
# 无构建前端资产随包走：原生 ES modules，产物即静态文件（D-063 ①）。
"st_agent.ui" = ["web/*.html", "web/css/*.css", "web/js/*.js", "web/js/components/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "项目管理/tools"]
addopts = "-q -m 'not live'"
markers = [
    "live: 真实网络/长跑集成用例（默认排除；用 pytest -m live 单跑，不进 CI）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
