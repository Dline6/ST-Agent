name: CI

# 把 Git协作规范 §5.2 的 PR gate 从「人工自觉」变成「机器强制」：
#   文档一致性（verify_docs --strict）——**每次必跑**；
#   测试（pytest）——按变更范围分层（见 工作流.md §测试分层）：
#     文档-only           → 跳过 pytest
#     代码 PR             → 按层映射（契约/打包变更即全量）
#     合入 main           → 只跑 verify_docs（PR 已按范围验过）
#     nightly / 手动 dispatch → 全量兜底
#
# 范围判定在 `项目管理/tools/ci_scope.py`（可被 tests/test_tools.py 直接钉住）。内联
# shell 曾在 2026-10 两次与文档漂移：`packaging/README.md` 触发全量、tools 变更跑 817 条。
#
# 为什么文档-only 还触发本 workflow：job 名 `check` 是 ruleset `main-require-ci`
# 要求的必检 context，而被路径过滤跳过的 workflow **不报状态**——用 paths-ignore
# 整个跳过会让必检永远 pending、auto-merge 卡死。故只能在 job 内条件跳过步骤。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:17 Asia/Shanghai（UTC 19:17）——避开整点，降低 runner 排队。
    # 一天只跑一次全量；白天合入再多也不会累积成多次。
    - cron: "17 19 * * *"
  workflow_dispatch: # 手动触发 = 强制全量

permissions:
  contents: read
  issues: write # nightly 失败时登记 issue

concurrency:
  # PR 连续推送只保留最后一轮；push / nightly 各自成组，互不取消。
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 判定变更范围需要 diff 基线
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 不配 `cache: pip`：push 路径会跳过「安装依赖」，pip 从未运行，
          # setup-python 的 post 步骤保存 ~/.cache/pip 时直接失败（2026-10-28 实测）。
          # 安装本身 5–8 秒，缓存收益不值得引入这条耦合。
      - name: 判定变更范围
        id: scope
        run: |
          set -euo pipefail
          # core.quotepath=false：否则非 ASCII 路径（`项目管理/tools/...`）会被八进制转义
          GIT="git -c core.quotepath=false"
          event="${{ github.event_name }}"
          if [ "$event" = "pull_request" ]; then
            changed=$($GIT diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            changed="" # push 不跑 pytest；schedule / dispatch 由脚本按事件判全量
          fi
          printf '%s\n' "$changed" | python 项目管理/tools/ci_scope.py --event "$event" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        if: steps.scope.outputs.run == 'true'
        # 装包本身（顺带验证打包配置可用）；baostock 是联网可选依赖（[market] extra），
        # 其缺失路径本身有测试覆盖（tests/l0/test_market.py::TestLiveFetcherOffline），故不装。
        run: |
          pip install -e .
          pip install pytest
      - name: 文档一致性自检
        run: python 项目管理/tools/verify_docs.py --strict
      - name: 测试
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest ${{ steps.scope.outputs.targets }}
      - name: 夜间全量失败时登记 issue
        # 夜间无人值守：红了必须有可查的落点，否则等于没跑。已有同名 open issue 就追加。
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --state open --search 'nightly CI failed in:title' \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "又一次失败：$url"
          else
            gh issue create --title "nightly CI failed" --body "夜间全量失败：$url"
          fi
